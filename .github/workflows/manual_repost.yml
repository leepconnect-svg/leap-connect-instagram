name: leap_connect Manual Repost (承認済み投稿の手動投稿)

# 品質ゲート(80点未満)で自動投稿が見送られたが、オーナーが画像を目視確認して
# 「このまま投稿してほしい」と明示的に指示した場合にのみ、手動で実行する。
# 再生成はせず、DBに保存済みの内容をそのまま投稿する。

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "投稿するpost_id (db/leapconnect.sqlite3 の posts.id)"
        required: true

permissions:
  contents: write

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repost existing content
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REPOST_POST_ID: ${{ github.event.inputs.post_id }}
        run: python scripts/repost_existing.py

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/leapconnect.sqlite3
          git diff --cached --quiet || git commit -m "chore: 手動投稿の記録を更新 [skip ci]"
          git pull --no-edit --rebase
          git push

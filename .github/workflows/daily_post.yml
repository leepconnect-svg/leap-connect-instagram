name: leap_connect Daily Instagram Post

on:
  schedule:
    # 毎日 9:00 JST (UTC 00:00) に実行。時刻や頻度を変えたい場合はここを編集
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (1にすると実際には投稿しない/生成のみ確認)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily post pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/main.py

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/leapconnect.sqlite3
          git diff --cached --quiet || git commit -m "chore: update posts database [skip ci]"
          git push

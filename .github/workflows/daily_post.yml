name: leap_connect Daily Instagram Post

on:
  schedule:
    # 毎日 9:00 JST (UTC 00:00) に実行。時刻や頻度を変えたい場合はここを編集
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (1にすると実際には投稿しない/生成のみ確認)"
        required: false
        default: "0"
      quality_threshold:
        description: "品質審査の合格ライン(0〜100)。過去の実績(60〜78点が中心)を踏まえ72に設定済み。動作確認用に一時的に変更したい場合のみ入力"
        required: false
        default: "72"
      force_theme:
        description: "動作確認用: 'vacancy_reuse'(空室活用3提案型) or 'minpaku_reuse'(民泊からの転用) でテーマ選定を迂回して強制テストする。通常は空欄"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily post pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          QUALITY_THRESHOLD: ${{ github.event.inputs.quality_threshold || '72' }}
          FORCE_THEME: ${{ github.event.inputs.force_theme || '' }}
        run: python scripts/main.py

      - name: Commit updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/leapconnect.sqlite3
          git diff --cached --quiet || git commit -m "chore: update posts database [skip ci]"
          git push
